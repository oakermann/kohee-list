name: Deploy

# main 에 합치면 Pages 하나(사이트 + API)를 배포하고 실제 사이트를 확인한다.
# 운영 DB 구조가 바뀌는 커밋(migrations/·schema.sql)은 배포하지 않는다 — 백업 → d1-migrate(apply)
# 를 손으로 돌린 뒤 이 워크플로를 수동 실행(workflow_dispatch)해 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kohee-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

      - name: Stop if this push changes the database schema
        id: schema
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "$before^{commit}" 2>/dev/null &&
             git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(migrations/|schema\.sql$)'; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "### 배포 안 함: DB 구조 변경 — 백업 → d1-migrate(apply) → Deploy 수동 실행" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Pages
        if: steps.schema.outputs.blocked != 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name kohee --branch main

      - name: Smoke check
        if: steps.schema.outputs.blocked != 'true'
        run: npm run smoke:check
