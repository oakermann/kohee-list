name: D1 Migrate

# 운영 DB 마이그레이션은 손으로만: inspect 로 상태를 보고, 백업한 뒤 apply("apply" 입력)로 적용한다.
# D1 은 30일 시점 복구(Time Travel)를 지원하지만, 큰 변경 전엔 wrangler d1 export 백업을 따로 받는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = 적용 대기 목록과 표 목록 / apply = 대기 중인 마이그레이션 적용"
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]
      confirm:
        description: 'apply 하려면 "apply" 라고 적기'
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Inspect
        run: |
          npx --yes wrangler@4 d1 migrations list kohee-list --remote
          npx --yes wrangler@4 d1 execute kohee-list --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
      - name: Apply
        if: inputs.mode == 'apply'
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo 'confirm 칸에 "apply" 가 없어 멈춤'; exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply kohee-list --remote
