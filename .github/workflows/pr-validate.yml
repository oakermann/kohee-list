name: PR Validate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # The deploy uploads .pages-deploy only, so a change to the root copy alone ships
      # nothing and the pull request still goes green. This check also covers the
      # cache-busting version, since a shipped asset that no page requests is invisible
      # in the same silent way. It used to run only in the scheduled smoke, hours late.
      - name: Deploy mirror and cache busting
        run: npm run check:deploy-sync

      - name: Unit tests
        run: npm run test:unit

      - name: KOHEE audit
        run: npm run audit:kohee

      - name: Git diff check
        run: git diff --check
