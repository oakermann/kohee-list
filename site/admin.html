<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운영 콘솔 | KOHEE LIST</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="./assets/base.css" />
    <link rel="stylesheet" href="./assets/admin.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="panel top">
        <h1>운영 콘솔</h1>
        <div class="btns">
          <a class="btn" href="index.html">메인</a>
          <button id="logout-btn" class="hidden" type="button">로그아웃</button>
        </div>
      </header>

      <!-- 비밀번호 하나. 브라우저가 저장할 수 있게 진짜 form + autocomplete. -->
      <form id="login-pane" class="panel hidden">
        <h2>들어가기</h2>
        <input
          type="text"
          name="username"
          autocomplete="username"
          value="admin"
          hidden
        />
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="어드민 비밀번호"
          required
        />
        <button class="primary" type="submit">들어가기</button>
        <div id="login-msg" class="meta"></div>
      </form>

      <section id="hub" class="hub hidden">
        <button type="button" class="tile" data-go="inbox">
          새로 들어옴 <b data-count="inbox"></b>
        </button>
        <button type="button" class="tile" data-go="public">
          공개 중 <b data-count="public"></b>
        </button>
        <button type="button" class="tile" data-go="down">
          내린 것 <b data-count="down"></b>
        </button>
        <button type="button" class="tile" data-go="errors">
          오류 제보 <b data-count="errors"></b>
        </button>
        <button type="button" class="tile" data-go="notice">공지</button>
        <button type="button" class="tile" data-go="csv">CSV 가져오기</button>
        <a
          class="tile"
          href="https://dash.cloudflare.com/af7aa3c563288f9665d219a6f8dd23dc/web-analytics"
          target="_blank"
          rel="noopener"
          >방문자 <small>Cloudflare</small></a
        >
      </section>

      <section id="view" class="panel hidden">
        <div class="view-head">
          <button id="back-btn" type="button">← 운영</button>
          <h2 id="view-title"></h2>
        </div>

        <div id="pane-list" class="pane">
          <div class="list-tools">
            <input id="search" placeholder="카페명·주소 검색" />
            <button id="new-cafe-btn" class="primary" type="button">
              신규 등록
            </button>
          </div>
          <div id="list" class="list"></div>
        </div>

        <div id="pane-errors" class="pane">
          <div id="error-list" class="list"></div>
        </div>

        <div id="pane-notice" class="pane">
          <textarea
            id="notice-input"
            placeholder="메인에 보여줄 공지 (비우면 공지 없음)"
          ></textarea>
          <button id="notice-save" class="primary" type="button">
            공지 저장
          </button>
        </div>

        <div id="pane-csv" class="pane">
          <div class="meta">
            새 카페만 후보로 들어갑니다(주소가 같은 카페는 건너뜀). 공개는 새로
            들어옴에서 합니다.
          </div>
          <label class="btn file-pick"
            ><input id="csv-file" type="file" accept=".csv,text/csv" /><span
              id="csv-file-name"
              >CSV 파일 고르기</span
            ></label
          >
          <div class="row2">
            <button id="csv-dry-run" type="button">검증</button>
            <button id="csv-upload" class="primary" type="button">
              올리기
            </button>
          </div>
          <div id="csv-msg" class="meta"></div>
        </div>
      </section>
    </main>

    <dialog id="cafe-dialog">
      <form id="cafe-form" method="dialog">
        <h2 id="form-title">카페</h2>
        <div id="form-note" class="meta"></div>
        <input id="cafe-name" placeholder="카페명 *" required />
        <input id="cafe-address" placeholder="주소 *" required />
        <div class="geo">
          <input id="cafe-lat" placeholder="위도" inputmode="decimal" />
          <input id="cafe-lng" placeholder="경도" inputmode="decimal" />
          <button id="geocode-btn" type="button">주소로 찾기</button>
        </div>
        <div id="geo-msg" class="meta"></div>
        <textarea id="cafe-desc" placeholder="설명 *" required></textarea>
        <div id="cafe-reason" class="meta"></div>
        <input id="cafe-signature" placeholder="시그니처 (쉼표 구분)" />
        <input id="cafe-instagram" placeholder="인스타 링크" />
        <input id="cafe-naver" placeholder="네이버 지도 링크 (place URL)" />
        <input id="cafe-bean" placeholder="원두 구매 링크" />
        <div class="row2">
          <input id="cafe-region" placeholder="가까운 역 (카드에 안 보임)" />
          <input
            id="cafe-region-distance"
            type="number"
            min="0"
            placeholder="역까지 m"
          />
        </div>
        <input id="cafe-memo" placeholder="운영 메모 (공개 안 됨)" />
        <div class="chips">
          <label class="chip"
            ><input
              type="checkbox"
              name="cat"
              value="espresso"
            />에스프레소</label
          >
          <label class="chip"
            ><input type="checkbox" name="cat" value="drip" />드립</label
          >
          <label class="chip"
            ><input type="checkbox" name="cat" value="decaf" />디카페인</label
          >
          <label class="chip"
            ><input type="checkbox" name="cat" value="instagram" />인스타</label
          >
          <label class="chip"
            ><input type="checkbox" name="cat" value="dessert" />디저트</label
          >
          <label class="chip"
            ><input type="checkbox" id="oakerman-pick" />오커맨픽</label
          >
        </div>
        <div class="form-actions">
          <button value="cancel" formnovalidate type="submit">닫기</button>
          <button id="form-save" class="primary" type="button">저장</button>
        </div>
      </form>
    </dialog>

    <footer class="page-legal-footer">
      <a href="privacy.html">개인정보 처리방침</a>
    </footer>

    <script type="module" src="./assets/admin.js"></script>
  </body>
</html>
