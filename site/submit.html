<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>제보하기 | KOHEE LIST</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="./assets/base.css" />
    <link rel="stylesheet" href="./assets/submit.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1 class="hero-title">[ 제보하기 ]</h1>
        <div class="account-line">
          로그인 없이 보냅니다. 처리 결과는 이 브라우저의 '찜·내 제보'에서 볼 수
          있습니다.
        </div>
        <nav class="action-strip">
          <a class="mini-btn" href="index.html">메인</a>
          <a class="mini-btn" href="mypage.html">찜·내 제보</a>
        </nav>
      </section>

      <section class="section">
        <h2 class="section-head">카페 제보하기</h2>
        <div class="section-rule"></div>
        <div class="section-body">
          <div class="guide">
            제보는 즉시 공개되지 않고 운영진 검토 후 반영됩니다.
          </div>
          <div class="pii-notice">
            타인의 이름·연락처 등 개인정보는 입력하지 마세요.
          </div>
          <label class="field"
            ><span>카페명 *</span><input id="name" required
          /></label>
          <label class="field"
            ><span>주소 *</span><input id="address" required
          /></label>
          <label class="field"
            ><span>카페 설명 *</span><textarea id="desc" required></textarea>
          </label>
          <label class="field"
            ><span>추천 이유</span><textarea id="reason"></textarea>
          </label>

          <div class="cat-grid">
            <label class="chip"
              ><input type="checkbox" name="cat" value="espresso" /><span
                >에스프레소</span
              ></label
            >
            <label class="chip"
              ><input type="checkbox" name="cat" value="drip" /><span
                >드립</span
              ></label
            >
            <label class="chip"
              ><input type="checkbox" name="cat" value="decaf" /><span
                >디카페인</span
              ></label
            >
            <label class="chip"
              ><input type="checkbox" name="cat" value="instagram" /><span
                >인스타</span
              ></label
            >
            <label class="chip"
              ><input type="checkbox" name="cat" value="dessert" /><span
                >디저트</span
              ></label
            >
          </div>

          <button id="submit-btn" class="mini-btn primary" type="button">
            카페 제보 저장
          </button>
          <div id="msg" class="msg"></div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head">오류 제보하기</h2>
        <div class="section-rule"></div>
        <div class="section-body">
          <div class="guide">
            카페 정보 오류, 링크 오류, 화면 오류 등을 알려주시면 운영진이
            확인합니다.
          </div>
          <div class="pii-notice">
            타인의 이름·연락처 등 개인정보는 입력하지 마세요.
          </div>
          <label class="field"
            ><span>오류 제목 *</span><input id="error-title" required
          /></label>
          <label class="field"
            ><span>관련 카페명 또는 페이지 (선택)</span><input id="error-page"
          /></label>
          <label class="field"
            ><span>오류 내용 *</span
            ><textarea id="error-content" required></textarea>
          </label>
          <button id="error-submit-btn" class="mini-btn primary" type="button">
            오류 제보 저장
          </button>
          <div id="error-msg" class="msg"></div>
        </div>
      </section>
    </main>

    <footer class="page-legal-footer">
      <a href="privacy.html">개인정보 처리방침</a>
    </footer>

    <script type="module" src="./assets/submit.js"></script>
  </body>
</html>
